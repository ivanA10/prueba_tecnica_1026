# Sistema Toka completo: infraestructura + 5 servicios + web (nginx :8080).
# Diseno: docs/architecture/04-docker-compose-diseno.md
# Etiquetas de imagen needs-verification: postgres:17, mongo:7, redis:7,
# rabbitmq:3.13-management, qdrant/qdrant:v1.15.0 (fijar/actualizar al instalar).
name: toka

x-infra-defaults: &infra-defaults
  restart: unless-stopped
  networks: [backend]

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [edge, backend]

# Healthchecks de Node (las imagenes slim no traen curl/wget); un ancla por puerto.
x-hc-3001: &hc-3001
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 4s
  retries: 12
  start_period: 30s
x-hc-3002: &hc-3002
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 4s
  retries: 12
  start_period: 30s
x-hc-3003: &hc-3003
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 4s
  retries: 12
  start_period: 30s
x-hc-3004: &hc-3004
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 4s
  retries: 12
  start_period: 30s
x-hc-3005: &hc-3005
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 4s
  retries: 12
  start_period: 60s

services:
  postgres:
    <<: *infra-defaults
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      ROLE_DB_PASSWORD: ${ROLE_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    <<: *infra-defaults
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: audit_db
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *infra-defaults
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    <<: *infra-defaults
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    <<: *infra-defaults
    image: qdrant/qdrant:v1.15.0
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- aplicaciones
  auth-service:
    <<: *app-defaults
    build: { context: ., dockerfile: apps/auth-service/Dockerfile }
    image: toka/auth-service:local
    env_file: infra/env/auth-service.env
    secrets: [jwt_private.pem]
    healthcheck: *hc-3001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  role-service:
    <<: *app-defaults
    build: { context: ., dockerfile: apps/role-service/Dockerfile }
    image: toka/role-service:local
    env_file: infra/env/role-service.env
    healthcheck: *hc-3003
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  user-service:
    <<: *app-defaults
    build: { context: ., dockerfile: apps/user-service/Dockerfile }
    image: toka/user-service:local
    env_file: infra/env/user-service.env
    healthcheck: *hc-3002
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      role-service: { condition: service_healthy }

  audit-service:
    <<: *app-defaults
    build: { context: ., dockerfile: apps/audit-service/Dockerfile }
    image: toka/audit-service:local
    env_file: infra/env/audit-service.env
    healthcheck: *hc-3004
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_healthy }

  ai-agent-service:
    <<: *app-defaults
    build: { context: ., dockerfile: apps/ai-agent-service/Dockerfile }
    image: toka/ai-agent-service:local
    env_file: infra/env/ai-agent-service.env
    networks: [edge, backend, egress]
    healthcheck: *hc-3005
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      user-service: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: toka/web:local
    restart: unless-stopped
    networks: [public, edge]
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      auth-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
      role-service: { condition: service_healthy }
      audit-service: { condition: service_healthy }
      ai-agent-service: { condition: service_healthy }

secrets:
  jwt_private.pem:
    file: ./secrets/jwt_private.pem

networks:
  public: {}
  edge:
    internal: true
  backend:
    internal: true
  egress: {}

volumes:
  pg_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
